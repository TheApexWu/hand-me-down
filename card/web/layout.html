<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HMD layout</title>
<style>
  :root { color-scheme: dark; --bg: #15161a; --panel: #1f2127; --line: #34373f; --fg: #e9e7e2; --dim: #9a9ca3; --go: #7fd1a0; --warn: #f0b35c; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.45 ui-sans-serif, system-ui, sans-serif; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; max-width: 1100px; }
  h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 0 0 8px; }
  .view { position: relative; line-height: 0; background: #000; border-radius: 6px; overflow: hidden; cursor: crosshair; user-select: none; min-height: 80px; }
  .view img { width: 100%; display: block; pointer-events: none; } .view svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  button, label.pill { font: inherit; color: var(--fg); background: #2b2e36; border: 1px solid var(--line); border-radius: 6px; padding: 6px 11px; cursor: pointer; }
  button.main { background: #2f5c44; border-color: #3d7a5a; }
  label.pill:has(input:checked) { background: #2f5c44; border-color: #3d7a5a; } label.pill input { display: none; }
  input[type=number] { width: 70px; font: inherit; color: var(--fg); background: #0004; border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; } .dim { color: var(--dim); } .go { color: var(--go); } .warn { color: var(--warn); }
  a { color: var(--go); }
</style>
<section>
  <h2>1 · The card in the frame <a href="/op">back to operator</a></h2>
  <div class="row"><span class="dim">Click the</span>
    <label class="pill"><input type="radio" name="target" value="corners" checked>card's corners</label>
    <label class="pill"><input type="radio" name="target" value="page">arm page's corners (optional)</label>
    <span class="dim">in order: top-left, top-right, bottom-right, bottom-left.</span>
    <button id="reset">Start over</button><button id="grab">New frame</button></div>
  <div class="view" id="frame"><img id="frame-img" alt=""><svg id="frame-svg" viewBox="0 0 1 1" preserveAspectRatio="none"></svg></div>
  <div class="row"><span class="dim">Card size, mm</span><input type="number" id="mm-w" step="0.5"> × <input type="number" id="mm-h" step="0.5"><span id="hint" class="warn"></span></div>
</section>
<section>
  <h2>2 · Areas on the card</h2>
  <div class="row"><span class="dim">Drag a box for</span>
    <label class="pill"><input type="radio" name="area" value="line" checked>the line</label>
    <label class="pill"><input type="radio" name="area" value="name">the name</label>
    <label class="pill"><input type="radio" name="area" value="tick">the tick box</label>
    <label class="pill"><input type="radio" name="area" value="number">the printed number</label>
    <button id="clear-area">Clear this one</button></div>
  <div class="view" id="cardv"><img id="card-img" alt=""><svg id="card-svg" viewBox="0 0 1 1" preserveAspectRatio="none"></svg></div>
</section>
<section><div class="row"><button class="main" id="save">Save card/layout.json</button><span id="saved" class="go"></span></div></section>
<script>
  const $ = id => document.getElementById(id);
  const COL = {line: '#ef7d7d', name: '#6aa9ff', tick: '#f0b35c', number: '#c9a0ff', corners: '#7fd1a0', page: '#6aa9ff'};
  let L = null, drag = null;
  const pick = name => document.querySelector(`input[name=${name}]:checked`).value;
  const at = (e, el) => { const r = el.getBoundingClientRect(); return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))]; };
  const r4 = v => Math.round(v * 10000) / 10000;

  function draw() {
    const dots = (pts, c) => (pts || []).map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="0.006" fill="${c}"/>`).join('') + ((pts || []).length > 1 ? `<polygon points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="${c}" stroke-width="2" vector-effect="non-scaling-stroke"/>` : '');
    $('frame-svg').innerHTML = dots(L.corners, COL.corners) + dots(L.page, COL.page);
    $('card-svg').innerHTML = ['line', 'name', 'tick', 'number'].map(k => L[k] ? `<rect x="${L[k][0]}" y="${L[k][1]}" width="${L[k][2]}" height="${L[k][3]}" fill="${COL[k]}22" stroke="${COL[k]}" stroke-width="2" vector-effect="non-scaling-stroke"/>` : '').join('') + (drag ? `<rect x="${drag[0]}" y="${drag[1]}" width="${drag[2]}" height="${drag[3]}" fill="none" stroke="#fff" stroke-dasharray="4" vector-effect="non-scaling-stroke"/>` : '');
    const need = (L.corners || []).length;
    $('hint').textContent = need < 4 ? `card corners: ${need} of 4 clicked` : '';
  }
  function card() {
    if ((L.corners || []).length !== 4) return;
    $('card-img').src = `/api/layout/card.jpg?corners=${L.corners.flat().join(',')}&mm=${L.card_mm.join(',')}&t=${Date.now()}`;
  }
  $('frame').onclick = e => {
    const key = pick('target');
    if (!L[key] || L[key].length >= 4) L[key] = [];
    L[key].push(at(e, $('frame')).map(r4));
    if (key === 'corners' && L.corners.length === 4) {
      if (!L.tick) { L.tick = [0.86, 0.04, 0.08, 0.13]; $('hint').textContent = 'tick box: a starting guess is drawn top right. Drag a new box over the real one.'; }
      card();
    }
    draw();
  };
  $('cardv').onmousedown = e => { const p = at(e, $('cardv')); drag = [p[0], p[1], 0, 0]; drag.o = p; };
  window.onmousemove = e => { if (!drag) return; const p = at(e, $('cardv')), o = drag.o; drag[0] = Math.min(o[0], p[0]); drag[1] = Math.min(o[1], p[1]); drag[2] = Math.abs(p[0] - o[0]); drag[3] = Math.abs(p[1] - o[1]); draw(); };
  window.onmouseup = () => { if (drag && drag[2] > 0.01 && drag[3] > 0.01) L[pick('area')] = [0, 1, 2, 3].map(i => r4(drag[i])); drag = null; draw(); };
  $('clear-area').onclick = () => { L[pick('area')] = pick('area') === 'line' ? [0, 0, 1, 1] : null; draw(); };
  $('reset').onclick = () => { L[pick('target')] = pick('target') === 'page' ? null : []; draw(); };
  $('grab').onclick = () => { $('frame-img').src = '/frame.jpg?t=' + Date.now(); card(); };
  $('mm-w').onchange = $('mm-h').onchange = () => { L.card_mm = [+$('mm-w').value, +$('mm-h').value]; card(); };
  $('save').onclick = async () => {
    if ((L.corners || []).length !== 4) { $('saved').textContent = ''; $('hint').textContent = 'click all four card corners first'; return; }
    const body = Object.fromEntries(['corners', 'card_mm', 'line', 'name', 'tick', 'number', 'page'].map(k => [k, L[k] && L[k].length ? L[k] : null]));
    const r = await fetch('/api/layout', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    $('saved').textContent = r.ok ? 'saved ' + new Date().toLocaleTimeString() : 'save failed';
  };
  (async () => {
    L = (await (await fetch('/api/status')).json()).layout;
    $('mm-w').value = L.card_mm[0]; $('mm-h').value = L.card_mm[1];
    $('frame-img').src = '/frame.jpg?t=' + Date.now();
    card(); draw();
  })();
</script>
</html>
