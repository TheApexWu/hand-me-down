<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand-Me-Down</title>
<style>
  /* The visitor screen. Handwriting crops only: no words are typed here, by anyone.
     Stages: idle, reading, confirm, choosing, writing, delivered (see card/server.py). */
  :root { --paper: #f3ede1; --ink: #1d1b18; --rule: #1d1b1833; --mark: #c2402d; }
  html, body { height: 100%; margin: 0; background: var(--paper); overflow: hidden; }
  main { height: 100%; display: grid; grid-template-columns: 1fr 1px 1fr; align-items: center; transition: grid-template-columns .6s; }
  .rule { background: var(--rule); height: 46vh; opacity: 0; transition: opacity .8s; }
  figure { margin: 0; padding: 0 4vw; display: grid; justify-items: center; gap: 3vh; min-width: 0; }
  .crop { position: relative; display: inline-block; opacity: 0; transform: translateY(6px); transition: opacity .9s ease, transform .9s ease; line-height: 0; }
  .crop.on { opacity: 1; transform: none; }
  .crop img { max-width: 100%; max-height: 56vh; mix-blend-mode: multiply; border-radius: 2px; }
  /* the quoted words, boxed in the ink itself */
  .crop i { position: absolute; border: 3px solid var(--mark); border-radius: 6px; opacity: 0; transition: opacity .8s 1.1s; box-sizing: border-box; margin: -4px; padding: 4px; }
  .pair .crop.on i { opacity: .85; }
  .pair .rule { opacity: 1; }
  /* alone on the screen: the visitor's own line, centred */
  .solo { grid-template-columns: 1fr 0 0; } .solo #theirs-fig { display: none; }
  /* picked by rule, not by the model: one small open ring under the stranger's line. offline: two. */
  .under { height: 16px; display: flex; gap: 8px; }
  .ring { width: 12px; height: 12px; border: 2px solid var(--ink); border-radius: 50%; opacity: 0; transition: opacity .8s; }
  .by-rule .ring:first-child, .by-offline .ring { opacity: .55; }
  /* confirm: is this your line? a tick and a cross, drawn, no words */
  #confirm { position: fixed; left: 0; right: 0; bottom: 9vh; display: none; justify-content: center; gap: 9vw; }
  .confirm #confirm { display: flex; }
  #confirm button { all: unset; cursor: pointer; width: 96px; height: 96px; border: 3px solid var(--ink); border-radius: 50%; display: grid; place-items: center; }
  #confirm svg { width: 46px; height: 46px; stroke: var(--ink); stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  /* reading / choosing: a slow dot, so the visitor knows it noticed */
  .dot { position: fixed; left: 50%; bottom: 7vh; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--ink); opacity: 0; }
  .reading .dot, .choosing .dot { animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .08 } 50% { opacity: .5 } }
  /* while the arm writes */
  #bar { position: fixed; left: 12vw; right: 12vw; bottom: 8vh; height: 3px; background: var(--rule); opacity: 0; transition: opacity .6s; }
  #bar b { display: block; height: 100%; width: 0; background: var(--ink); }
  .writing #bar { opacity: 1; }
  /* the postmark: when the stranger wrote it, when the arm delivered it, how long it took */
  #postmark { position: fixed; right: 5vw; bottom: 6vh; width: 150px; height: 150px; opacity: 0; transform: rotate(-9deg) scale(1.15); transition: opacity .5s, transform .5s; color: var(--mark); }
  .delivered #postmark { opacity: .8; transform: rotate(-9deg); }
  #postmark text { font: 600 15px ui-monospace, Menlo, monospace; fill: currentColor; letter-spacing: .08em; }
</style>
<main id="m" class="solo">
  <figure><div class="crop" id="yours"><img alt=""></div><div class="under"></div></figure>
  <div class="rule"></div>
  <figure id="theirs-fig"><div class="crop" id="theirs"><img alt=""></div><div class="under"><span class="ring"></span><span class="ring"></span></div></figure>
</main>
<div id="confirm">
  <button id="no" aria-label="no"><svg viewBox="0 0 48 48"><path d="M10 10 L38 38 M38 10 L10 38"/></svg></button>
  <button id="yes" aria-label="yes"><svg viewBox="0 0 48 48"><path d="M8 26 L20 38 L40 10"/></svg></button>
</div>
<div class="dot"></div>
<div id="bar"><b></b></div>
<svg id="postmark" viewBox="0 0 150 150">
  <circle cx="75" cy="75" r="70" fill="none" stroke="currentColor" stroke-width="3"/>
  <circle cx="75" cy="75" r="58" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text id="pm-a" x="75" y="52" text-anchor="middle"></text>
  <path d="M40 75 H110 M100 68 L110 75 L100 82" fill="none" stroke="currentColor" stroke-width="2"/>
  <text id="pm-b" x="75" y="104" text-anchor="middle"></text>
  <text id="pm-c" x="75" y="124" text-anchor="middle" style="font-size:11px"></text>
</svg>
<script>
  const $ = id => document.getElementById(id), m = $('m');
  let seen = null, st = {};
  function show(el, src, marks, v) {
    const img = el.querySelector('img');
    if (!src) { el.classList.remove('on'); return; }
    el.querySelectorAll('i').forEach(i => i.remove());
    for (const [l, t, w, h] of marks || []) {
      const i = document.createElement('i');
      i.style.cssText = `left:${l * 100}%;top:${t * 100}%;width:${w * 100}%;height:${h * 100}%`;
      el.appendChild(i);
    }
    if (el.dataset.src === src) { el.classList.add('on'); return; }
    el.classList.remove('on');
    img.onload = () => el.classList.add('on');
    el.dataset.src = src;
    img.src = src + '?v=' + v;
  }
  const answer = yes => fetch('/api/confirm', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({yes})});
  $('yes').onclick = () => answer(true); $('no').onclick = () => answer(false);
  document.addEventListener('keydown', e => { if (st.stage === 'confirm') { if (e.key === 'y' || e.key === 'Enter') answer(true); if (e.key === 'n') answer(false); } });
  const mins = s => s == null ? '' : Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0');
  async function tick() {
    try {
      const s = await (await fetch('/state.json', {cache: 'no-store'})).json();
      if (s.v !== seen) {
        seen = s.v; st = s;
        const pair = (s.stage === 'writing' || s.stage === 'delivered') && s.stranger;
        document.body.className = s.stage;
        m.className = (pair ? 'pair' : 'solo') + (s.by ? ' by-' + s.by : '');
        const marks = s.marks || {};
        show($('yours'), ['confirm', 'choosing', 'writing', 'delivered'].includes(s.stage) ? s.visitor : null, pair ? marks.visitor : [], s.v);
        show($('theirs'), pair ? s.stranger : null, marks.stranger, s.v);
        const p = s.postmark || {};
        $('pm-a').textContent = p.written_at || ''; $('pm-b').textContent = (String(p.delivered_at || '').match(/\d{1,2}:\d{2}/) || [''])[0];
        $('pm-c').textContent = mins(p.duration_s);
      }
      if (st.stage === 'writing') $('bar').firstElementChild.style.width = Math.min(96, 100 * (Date.now() / 1000 - st.started) / (st.est_s || 120)) + '%';
      if (st.stage === 'delivered') $('bar').firstElementChild.style.width = '100%';
    } catch (e) {}
    setTimeout(tick, 400);
  }
  tick();
</script>
</html>
