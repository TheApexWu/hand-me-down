<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arm</title>
<style>
  html, body { height: 100%; margin: 0; background: #f3ede1; overflow: hidden; }
  #arm { position: fixed; inset: 0; }
</style>
<div id="arm"></div>
<script type="module">
  // Test page for the arm panel: the panel alone, full window.
  //   demo.html                       polls /pose.json, as the screen will
  //   demo.html?fake=1                no server: a slow loop (rest, write two lines on the card, rest)
  //   demo.html?fake=1&hold=9         the loop frozen 9 s in
  //   demo.html?fake=1&pose=20,45,-30,20,40   one fixed pose: pan, lift, elbow, wrist flex, wrist roll (deg)
  //   ...&stale=1                     the same pose served again and again with an old t: ARM OFFLINE
  import { mountArm } from './arm.js';

  const JOINTS = ['shoulder_pan', 'shoulder_lift', 'elbow_flex', 'wrist_flex', 'wrist_roll'];
  // seconds, then the five joints in degrees. Solved for the pen point on the card in scene.json
  // (riser_box_v1), the pen near vertical and every joint inside the model's range.
  const LOOP = [
    [0,-0.26,1.41,1.19,-0.13,-0.04],[2.5,-0.26,1.41,1.19,-0.13,-0.04],[2.9,-1.19,1.13,0.84,3.96,-0.04],
    [3.3,-3.63,0.38,-0.1,14.73,-0.03],[3.7,-7.07,-0.68,-1.42,29.97,-0.03],[4.1,-11.03,-1.9,-2.93,47.44,-0.02],
    [4.5,-14.98,-3.11,-4.45,64.9,-0.01],[4.9,-18.43,-4.17,-5.77,80.14,-0.01],[5.3,-20.87,-4.92,-6.7,90.91,0],
    [5.7,-21.8,-5.21,-7.06,95,0],[6.6,-21.8,1.21,-9.32,95,0],[7.02,-19.97,1.28,-9.41,95,0],[7.44,-18.48,-0.43,-7.34,95,0],
    [7.86,-16.72,-0.89,-6.79,95,0],[8.28,-14.8,-0.17,-7.65,95,0],[8.7,-13.12,-1.32,-6.28,95,0],
    [9.12,-11.38,-2.27,-5.15,95,0],[9.54,-9.48,-1.25,-6.35,95,0],[9.96,-7.68,-1.54,-6.01,95,0],
    [10.38,-5.88,-2.77,-4.57,95,0],[10.8,-4.05,-1.87,-5.62,95,0],[11.22,-2.26,-1.22,-6.4,95,0],
    [11.64,-0.38,-2.32,-5.09,95,0],[12.06,1.42,-1.86,-5.64,95,0],[12.48,3.1,-0.47,-7.29,95,0],
    [13.38,3.19,-7.98,-4.01,95,0],[13.78,2.07,-8.06,-3.92,95,0],[14.18,-0.87,-8.27,-3.7,95,0],
    [14.58,-5.02,-8.56,-3.38,95,0],[14.98,-9.79,-8.9,-3.02,95,0],[15.38,-14.56,-9.24,-2.66,95,0],
    [15.78,-18.72,-9.54,-2.34,95,0],[16.18,-21.66,-9.75,-2.11,95,0],[16.58,-22.77,-9.83,-2.03,95,0],
    [17.48,-22.77,-2.85,-4.48,95,0],[17.9,-20.84,-2.81,-4.51,95,0],[18.32,-19.29,-4.65,-2.39,95,0],
    [18.74,-17.43,-5.17,-1.8,95,0],[19.16,-15.38,-4.43,-2.64,95,0],[19.58,-13.62,-5.68,-1.22,95,0],
    [20,-11.78,-6.72,-0.06,95,0],[20.42,-9.75,-5.65,-1.26,95,0],[20.84,-7.85,-5.96,-0.91,95,0],
    [21.26,-5.94,-7.28,0.56,95,0],[21.68,-3.99,-6.32,-0.51,95,0],[22.1,-2.08,-5.62,-1.3,95,0],[23,-2.05,-13.91,2.17,95,0],
    [23.45,-1.97,-13.25,2.13,90.91,0],[23.9,-1.77,-11.52,2.02,80.14,-0.01],[24.35,-1.48,-9.06,1.86,64.9,-0.01],
    [24.8,-1.15,-6.25,1.68,47.44,-0.02],[25.25,-0.83,-3.44,1.5,29.97,-0.03],[25.7,-0.54,-0.98,1.34,14.73,-0.03],
    [26.15,-0.34,0.75,1.23,3.96,-0.04],[26.6,-0.26,1.41,1.19,-0.13,-0.04],[28.1,-0.26,1.41,1.19,-0.13,-0.04],
  ];

  function loopAt(seconds) {
    const t = seconds % LOOP[LOOP.length - 1][0];
    let i = 1;
    while (LOOP[i][0] < t) i++;
    const a = LOOP[i - 1], b = LOOP[i], f = (t - a[0]) / (b[0] - a[0] || 1);
    return a.slice(1).map((v, k) => v + (b[k + 1] - v) * f);
  }

  const q = new URLSearchParams(location.search);
  const options = {};
  if (q.has('fake')) {
    const born = Date.now() / 1000;
    const fixed = q.has('pose') ? q.get('pose').split(',').map(Number) : null;
    options.getPose = () => {
      const now = Date.now() / 1000;
      const deg = fixed || loopAt(q.has('hold') ? Number(q.get('hold')) : now - born);
      const pos = Object.fromEntries(JOINTS.map((name, k) => [name, deg[k] || 0]));
      return { pos, phase: 'demo', t: q.has('stale') ? born - 60 : now };
    };
  }
  window.arm = mountArm(document.getElementById('arm'), options);
</script>
</html>
